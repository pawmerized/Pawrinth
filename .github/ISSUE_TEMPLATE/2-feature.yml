name: Feature request
description: An idea that would make Pawrinth better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with?
      description: The situation or problem, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Other launchers that do it well, screenshots, mock-ups.
